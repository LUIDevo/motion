[package]
name = "motion"
version = "0.1.0"
description = "Motion graphics for app demos"
authors = ["louis"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

# Media is served to the webview over loopback HTTP rather than the asset
# protocol. WebKitGTK decodes media in a separate process that can't reach a
# custom URI scheme handler, and HTTP additionally brings correct Range support
# — which is what makes seeking a large recording cheap.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors"] }
tower = "0.5"

# Screen capture on Wayland. The compositor never exposes the global cursor
# position to applications, so the only way to get real cursor coordinates is
# the ScreenCast portal with its cursor delivered as stream metadata, which
# means consuming the PipeWire stream ourselves.
[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
